spring.application.name=employee-management-system

# ---- Database (PostgreSQL, default) ----
# Switch profiles with: --spring.profiles.active=mysql or =h2
spring.datasource.url=jdbc:postgresql://localhost:5432/ems_db
spring.datasource.username=ems_user
spring.datasource.password=ems_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- JWT ----
# Override in production via env var APP_JWT_SECRET (min 32 chars for HS256)
app.jwt.secret=${APP_JWT_SECRET:change-this-super-secret-key-min-32-characters-long}
app.jwt.expiration-ms=86400000

server.port=8080
